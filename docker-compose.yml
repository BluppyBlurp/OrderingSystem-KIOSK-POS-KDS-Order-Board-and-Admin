# Local development: Postgres in a container (production uses Neon).
# Start the database:  docker compose up -d db
# Then run the API:    dotnet run --project backend/src/Kiosk.Api
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiosk
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: kiosk
    ports:
      - "5432:5432"
    volumes:
      - kiosk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk -d kiosk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kiosk-db:
